[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archolith-oauth"
version = "0.3.1"
description = "Reusable OAuth 2.1 building blocks for Archolith services and remote MCP resources."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Charles Harvey" }]
dependencies = [
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "joserfc>=1.0,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.scripts]
archolith-oauth = "archolith_oauth.cli:main"

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
]

[project.urls]
Repository = "https://github.com/ctharvey/archolith_oauth"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
